name: build

on:
  push:
    branches:
    - main
  workflow_dispatch:

# 同一时间只允许一个部署：连续两次 push 时取消进行中的旧 run，
# 避免两个 job 同时向 gh-pages force-push 互相覆盖（2026-11-16）
concurrency:
  group: deploy
  cancel-in-progress: true

# 构建与 style-lint 只需要读源码；部署走 PAT，不需要放宽 GITHUB_TOKEN
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.169.0'
        extended: false

    - name: Install Dart Sass
      run: |
        curl -fsSL -o /tmp/dart-sass.tar.gz \
          https://github.com/sass/dart-sass/releases/download/1.107.0/dart-sass-1.107.0-linux-x64.tar.gz
        tar -xzf /tmp/dart-sass.tar.gz -C /tmp
        echo "/tmp/dart-sass" >> "$GITHUB_PATH"
        /tmp/dart-sass/sass --version

    - name: Style lint
      run: python3 tools/style-lint/check_style.py

    - name: Build
      run: hugo --gc --minify --cleanDestinationDir --panicOnWarning

    - name: Deploy
      env:
        TZ: Asia/Shanghai
        DEPLOY_REPO: guanqr/photo-folio
        DEPLOY_BRANCH: gh-pages
        PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
      run: |
        cd ./public && git init -b main
        git config user.name "guanqr"
        git config user.email "guanqirui@zju.edu.cn"
        git add .
        git commit -m "Automated Deployment @ $(date '+%Y-%m-%d %H:%M:%S') ${TZ}"
        git push --force --quiet "https://$PERSONAL_TOKEN@github.com/$DEPLOY_REPO" main:$DEPLOY_BRANCH
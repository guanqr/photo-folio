# 观鸟图鉴物种资料：灯箱「觀鳥圖鑑」区块的数据源
# id 与 photo.toml 的 species 字段对应；文本为繁体内容，来源见每条的 [[bird.source]]

[[bird]]
id = "fairy-pitta"
name = "仙八色鶇"
latin = "Pitta nympha"
english = "Fairy Pitta"
order = "雀形目"
order_latin = "Passeriformes"
family = "八色鶇科"
family_latin = "Pittidae"
genus = "八色鶇屬"
genus_latin = "Pitta"
distribution = "繁殖於日本、朝鮮半島、中國東部與臺灣；冬季南遷至東南亞，主要越冬地為婆羅洲的低地森林。"
habitat = "繁殖季棲於低海拔潮濕闊葉林與混合林，偏好林下植被茂密、落葉層深厚的環境；越冬地亦以低地森林為主。"
habits = "多在地面翻找落葉層覓食，主食蚯蚓、甲蟲與其他昆蟲，也取食小型無脊椎動物；性情隱蔽，為長距離遷徙候鳥。"

[[bird.source]]
label = "IOC World Bird List"
url = "https://www.worldbirdnames.org/"

[[bird.source]]
label = "BirdLife International"
url = "https://datazone.birdlife.org/species/factsheet/fairy-pitta-pitta-nympha"

[[bird.source]]
label = "Wikipedia"
url = "https://en.wikipedia.org/wiki/Fairy_pitta"

[[bird]]
id = "grey-heron"
name = "蒼鷺"
latin = "Ardea cinerea"
english = "Grey Heron"
order = "鵜形目"
order_latin = "Pelecaniformes"
family = "鷺科"
family_latin = "Ardeidae"
genus = "鷺屬"
genus_latin = "Ardea"
distribution = "廣布於歐洲、亞洲與非洲的濕地；北方族群多隨季節南遷，南方族群常為留鳥。"
habitat = "棲於河流、湖泊、池塘、沼澤、水田、河口與海岸等淺水環境，常在岸邊樹木或蘆葦叢附近活動。"
habits = "以魚類為主，也捕食兩棲類、甲殼類、昆蟲與小型脊椎動物；常靜立水邊伏擊，晨昏活動較頻繁。"

[[bird.source]]
label = "IOC World Bird List"
url = "https://www.worldbirdnames.org/"

[[bird.source]]
label = "BirdLife International"
url = "https://datazone.birdlife.org/species/factsheet/grey-heron-ardea-cinerea"

[[bird.source]]
label = "Wikipedia"
url = "https://en.wikipedia.org/wiki/Grey_heron"

[[bird]]
id = "spot-billed-duck"
name = "斑嘴鴨"
latin = "Anas zonorhyncha"
english = "Eastern Spot-billed Duck"
order = "雁形目"
order_latin = "Anseriformes"
family = "鴨科"
family_latin = "Anatidae"
genus = "鴨屬"
genus_latin = "Anas"
distribution = "繁殖於東亞與俄羅斯遠東地區，冬季南遷至中國南方、臺灣與東南亞；日本與朝鮮半島部分族群為留鳥。"
habitat = "棲於湖泊、水庫、河流、池塘、沼澤與水田等淡水濕地，遷徙與越冬期也利用河口、海灣與農田。"
habits = "以水生植物的葉、莖、根與種子為主食，也取食水生昆蟲與軟體動物；多以浮游方式在水面覓食，晨昏與夜間較活躍。"

[[bird.source]]
label = "IOC World Bird List"
url = "https://www.worldbirdnames.org/"

[[bird.source]]
label = "BirdLife International"
url = "https://datazone.birdlife.org/species/factsheet/eastern-spot-billed-duck-anas-zonorhyncha"

[[bird.source]]
label = "Wikipedia"
url = "https://en.wikipedia.org/wiki/Eastern_spot-billed_duck"

[[bird]]
id = "chinese-goose"
name = "鴻雁"
display_name = "白鵝（鴻雁）"
latin = "Anser cygnoides"
order = "雁形目"
order_latin = "Anseriformes"
family = "鴨科"
family_latin = "Anatidae"
genus = "雁屬"
genus_latin = "Anser"
distribution = "白鵝是鴻雁的馴化型，世界各地均有飼養；其野生祖先繁殖於蒙古、西伯利亞與中國北方的草原濕地，冬季南遷至中國東部與長江流域。"
habitat = "白鵝常見於公園水域、農家與湖泊周邊；野生鴻雁棲於草原湖泊、沼澤、河漫灘與農田。"
habits = "白鵝以水生植物、青草、穀物與昆蟲為食，善游泳，常在水陸之間覓食；野生鴻雁成群活動，繁殖季在濕地築巢，冬季結群遷徙。"
conservation_level = "domestic"


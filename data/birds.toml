url = "https://en.wikipedia.org/wiki/Grey_heron"

[[bird]]
id = "spot-billed-duck"
name = "斑嘴鴨"
latin = "Anas zonorhyncha"
order = "雁形目"
order_latin = "Anseriformes"
family = "鴨科"
family_latin = "Anatidae"
genus = "鴨屬"
genus_latin = "Anas"
distribution = "繁殖於東亞與俄羅斯遠東地區，冬季南遷至中國南方、臺灣與東南亞；日本與朝鮮半島部分族群為留鳥。"
habitat = "棲於湖泊、水庫、河流、池塘、沼澤與水田等淡水濕地，遷徙與越冬期也利用河口、海灣與農田。"
habits = "以水生植物的葉、莖、根與種子為主食，也取食水生昆蟲與軟體動物；多以浮游方式在水面覓食，晨昏與夜間較活躍。"
conservation_level = "lc"


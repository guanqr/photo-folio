# 观鸟图鉴物种资料：灯箱「觀鳥圖鑑」区块的数据源
# id 与 photo.toml 的 species 字段对应；文本为繁体内容，来源见每条的 [[bird.source]]
# 属于该系列的观鸟照片即使缺少 species 也显示图鉴开关，展开提示缺少资料
bird_series = "觀鳥"

[[bird]]
id = "fairy-pitta"
name = "仙八色鶇"
latin = "Pitta nympha"
order = "雀形目"
order_latin = "Passeriformes"
family = "八色鶇科"
family_latin = "Pittidae"
genus = "八色鶇屬"
genus_latin = "Pitta"
distribution = "繁殖於日本、朝鮮半島、中國東部與臺灣；冬季南遷至東南亞，主要越冬地為婆羅洲的低地森林。"
habitat = "繁殖季棲於低海拔潮濕闊葉林與混合林，偏好林下植被茂密、落葉層深厚的環境；越冬地亦以低地森林為主。"
habits = "多在地面翻找落葉層覓食，主食蚯蚓、甲蟲與其他昆蟲，也取食小型無脊椎動物；性情隱蔽，為長距離遷徙候鳥。"
conservation_level = "vu"


# 足迹地图与地点页统一数据源：name 必须与 data/photo.toml 的 location 字段逐字一致
# slug 决定地点页 URL（/footprint/<slug>/，由 content/footprint/_content.gotmpl 构建期生成）与画廊筛选参数

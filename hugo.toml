baseURL = "https://photo.guanqr.com/"
locale = "zh-hant"
title = "啼鳥怨年華"
theme = "photofolio"

defaultContentLanguage = "zh-hant"

# dev server（hugo server）专用：JS/CSS 在 server 模式无哈希文件名（bundle.js），
# 无 Cache-Control 时浏览器启发式缓存会把旧构建留在普通刷新里、本地调试被陈旧
# 代码卡住（2026-10-20 实测）——强制 no-cache，生产构建不受影响
[[server.headers]]
    for = "/js/**"
    [server.headers.values]
        Cache-Control = "no-cache"

[[server.headers]]
    for = "/css/**"
    [server.headers.values]
        Cache-Control = "no-cache"

# 分析 JSON 同理：URL 不随 schema 版本变化，启发式缓存会在 v4→v5 等升级后
# 继续回旧结果，新代码校验失败、部分照片显示分析失败（2026-10-25 实测）
[[server.headers]]
    for = "/analysis/**"
    [server.headers.values]
        Cache-Control = "no-cache"

# 清空 Hugo 内置分类法（默认 tag/categories 不用）——否则 content/categories/ 会被
# 识别为「categories 分类法」而非普通 Section，子目录变成 term 页
[taxonomies]

# RSS 订阅源（/index.xml）：纯文本模板（isPlainText）——不转义 CDATA、URL 中的中文与日期时间
[outputFormats.rss]
    mediaType = "application/rss+xml"
    baseName = "index"
    isPlainText = true

[outputs]
    home = ["HTML", "rss"]
    # RSS 只保留首页摄影 feed；section 默认也会生成空的 /section/index.xml，
    # 与 head 的 rel=alternate 一起造成空订阅（2026-10-31）
    section = ["HTML"]

[params]
    description = "用鏡頭記錄生活的每一個瞬間"
    heroTitle = "向時間借一瞬"
    heroSubtitle = "按下快門，世界便安靜了半拍"
    # 首页轮播图数量（1-12 张，超出范围自动钳制到边界值）
    carouselCount = 6
    # 首页轮播自动播放间隔（毫秒；0 禁用自动播放，其余最小 1200——与淡入淡出时长一致）
    carouselInterval = 5000
    # 灯箱自动播放间隔（毫秒；默认关闭、用户点播放后生效；0 禁用并隐藏按钮）
    lightboxAutoplay = 5000
    logo = ""
    # 自定义底部版权文字 (支持 HTML 标签，如 <a> 链接)
    copyrightText = ""

    # 摄影作品订阅源（/index.xml，RSS 2.0）：最近发布的作品条数（按发布时间倒序）
    feedCount = 20

    # 首页分类卡片封面策略（两种模式互斥）：
    #   custom           = 仅使用分类页 front matter 的 cover 自定义封面（无则卡片不带图）
    #   latest-landscape = 默认：忽略自定义封面，取最新一张横构图作品为封面
    categoryCover = "latest-landscape"

    # 图床/CDN 基础 URL。
    # 设置后，所有本地图片路径会自动拼接此前缀。
    # 留空或注释掉则使用本地图片。末尾无需加斜杠。
    imageCDN = "https://guanqr.oss-cn-hangzhou.aliyuncs.com"

    # 启用 Service Worker (仅在 hugo 构建生产环境时生效)
    enableServiceWorker = true

    # instant.page 链接预取：SPA 已拦截点击自行 fetch，且 SW 对 HTML 走 NetworkFirst，
    # 预取结果不会被 SPA 复用（悬停预取 + 点击 fetch 重复整页请求），故关闭；
    # 保留开关以便未来 SPA 自带悬停预取后重新评估
    enableInstantPage = false

    # 年份合并分界：早于此年份的年份合并为一档（如 2024 → 「2024 前」，即 2023 及更早；0 = 不合并）
    # 同时作用于全部作品页年份筛选与关于页「拍摄档案」年度走势
    yearMergeBefore = 2024
    # 列表页 JSON-LD 最多输出的照片条数（0 = 不限制；EXIF 明细不进 JSON-LD）
    jsonldPhotoLimit = 24

    # 图片尺寸与质量配置（用于 OSS 图片处理参数）
    # 注意：本节开始后到下一节标题前的键都属于 [params.imageSizes]——
    # 新增 [params] 级开关请写在上面两行之前，否则会被归入本节而失效
    [params.imageSizes]
        gallery = 800          # 瀑布流缩略图
        strip = 240            # 灯箱底部缩略图条（小图，lazy 加载）
        carousel = 1920        # 首页轮播图回退宽度（无 srcset 环境）
        carouselWidths = [640, 960, 1280, 1920]  # 轮播 srcset 候选宽度
        category = 1000        # 分类卡片封面
        lightbox = 1920        # 灯箱大图
        lightboxNarrow = 1280  # 窄屏（≤1000px）灯箱主图宽度
        ogWidth = 1200         # Open Graph 宽度
        ogHeight = 630         # Open Graph 高度
        quality = 80           # 默认质量
        lightboxQuality = 90   # 灯箱质量
        ogQuality = 85         # 社交媒体封面质量
        # 瀑布流黑白低清占位图（LQIP）：OSS 端缩小并烘焙高斯模糊，前端转灰度后垫底
        placeholder = 64       # 占位图宽度（px，按原比例；越小越接近低像素块）
        placeholderQuality = 30
        placeholderBlur = 3    # 模糊半径/标准差（OSS blur 的 r_/s_ 同值）

    # 瀑布流加载策略（模板写入网格 data 属性，masonry 读取）：
    # 首屏只揭示可见窗口内的行，之后正常下拉逐行补载
    [params.grid]
        rowLoadRatio = 0.5      # 下一行至少一半进入视口后才逐行加载
        lcpPreload = 4          # 首行前 N 张卡片在 HTML 中直接写 src（0 关闭）

    # 全部作品页筛选栏：自行选择开启哪些筛选维度（true 开启 / false 关闭）
    [params.galleryFilters]
        scope = true
        year = true
        location = false
        category = false

    # 灯箱信息区块：自行选择开启哪些区块（true 开启 / false 关闭）
    # 色卡/影调/飽和度/色相都关闭时跳过探测下载（不发请求）
    [params.lightbox]
        meta = true          # 地點/日期简行
        exif = true          # EXIF 分行（焦距/光圈/快門/感光度）
        palette = true       # 色卡
        story = true         # 背後的故事
        tonal = true        # 影調（高/中/低調 × 長/中/短調 + 合并直方圖/區域系統/三区占比）
        saturation = true    # 飽和度分布
        hue = true           # 色相分布

[params.author]
    name = "Guanqr"
    avatar = "/icons/favicon.svg"
    bio = "舍南舍北皆春水，但見群鷗日日來"

[params.typography]
    # 字体外链对象数组（支持 preconnect 与 stylesheet 混排）：只指向自建字体库的
    # I.MingCP / LXGW，不再引入思源宋体或 Google Fonts 镜像；统一 fonts.min.css
    # 会连带引入未使用的 JetBrains Mono / Amstelvar，故按需分别加载
    fontLinks = [
        { rel = "preconnect", href = "https://cdn.jsdelivr.net", crossorigin = true },
        { rel = "stylesheet", href = "https://cdn.jsdelivr.net/gh/guanqr/fonts@build/css/imingcp.min.css" },
        { rel = "stylesheet", href = "https://cdn.jsdelivr.net/gh/guanqr/fonts@build/css/lxgwwenkaitc.min.css" }
    ]

    # 【重要】字体名称不要加引号，不要加逗号，只写核心字体名
    # 标题与正文同用 I.MingCP（仅提供 400 字重，600/700 由浏览器合成粗体）
    headingFont = "Glyph Correction, I.MingCP"
    bodyFont = "Glyph Correction, I.MingCP"
    footerFont = "Glyph Correction, LXGW WenKai TC"
    metaFont = "Glyph Correction, LXGW WenKai TC"

    # 基础字号 (这些是纯数字+单位，不会触发 ZgotmplZ)
    baseFontSize = "16px"
    sizeH1 = "2.5em"
    sizeH2 = "2em"
    sizeH3 = "1.5em"
    sizeBody = "1em"
    sizeSmall = "0.875em"
    sizeMeta = "0.8em"
    sizeFooter = "0.85em"

[menu]
    [[menu.main]]
        name = "首頁"
        url = "/"
        weight = 1
        [menu.main.params]
        icon = "home"
    [[menu.main]]
        name = "作品"
        url = "/gallery/"
        weight = 2
        identifier = "works"
        [menu.main.params]
        icon = "grid"

    [[menu.main]]
        name = "作品分類"
        url = "/categories/"
        weight = 1
        parent = "works"
        [menu.main.params]
        icon = "tag"

    [[menu.main]]
        name = "系列合集"
        url = "/series/"
        weight = 2
        parent = "works"
        [menu.main.params]
        icon = "layers"

    [[menu.main]]
        name = "全部作品"
        url = "/gallery/"
        weight = 3
        parent = "works"
        [menu.main.params]
        icon = "images"
    [[menu.main]]
        name = "足跡"
        url = "/footprint/"
        weight = 3
        [menu.main.params]
        icon = "footprints"
    [[menu.main]]
        name = "關於"
        url = "/about/"
        weight = 7
        [menu.main.params]
        icon = "user"
    # [[menu.main]]
    #     name = "博客"
    #     url = "https://guanqr.com/"
    #     weight = 8

# 站点地图：Hugo 内置生成 /sitemap.xml（仅页面 URL、不含图片地址——OSS 额度保护）；
# 404 等非内容页默认排除
[sitemap]
    changeFreq = "weekly"
    priority = 0.5


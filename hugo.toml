baseURL = "https://photo.guanqr.com/"
languageCode = "zh-cn"
title = "荷戟獨彷徨"
theme = "photofolio"

defaultContentLanguage = "zh-cn"

[params]
    description = "用鏡頭記錄世界的每一個瞬間"
    heroTitle = "用鏡頭記錄世界"
    heroSubtitle = "每一幀都是一個故事"
    logo = ""
    # 自定义底部版权文字 (支持 HTML 标签，如 <a> 链接)
    copyrightText = ""

    # 图床/CDN 基础 URL。
    # 设置后，所有本地图片路径会自动拼接此前缀。
    # 留空或注释掉则使用本地图片。末尾无需加斜杠。
    imageCDN = "https://guanqr.oss-cn-hangzhou.aliyuncs.com" 

    # 启用 Service Worker (仅在 hugo 构建生产环境时生效)
    enableServiceWorker = true 

    # 是否开启 instant.page 链接预加载加速 (true 为开启，false 为关闭)
    enableInstantPage = true 

[params.author]
    name = "Guanqr"
    avatar = "/icons/favicon.svg"
    bio = "用鏡頭記錄世界的每一個瞬間"

    [[params.author.equipment]]
        category = "相機"
        items = ["Nikon Z5", "Nikon Z8"]

    [[params.author.equipment]]
        category = "鏡頭"
        items = ["NIKKOR Z 24-200mm f/4-6.3 VR", "NIKKOR Z 24-70mm f/4 S"]

    [[params.author.equipment]]
        category = "後期處理"
        items = ["DxO PureRAW", "Adobe Lightroom", "Adobe Photoshop"]

[params.typography]
    # 【升级】字体外链对象数组 (支持 preconnect 和 stylesheet 混排)
    fontLinks = [
        # 1. 自定义字体的预连接
        { rel = "preconnect", href = "https://cdn.jsdelivr.net", crossorigin = true },
        # 2. 自定义字体的样式表
        { rel = "stylesheet", href = "https://cdn.jsdelivr.net/gh/guanqr/fonts@build/css/fonts.min.css" },
        
        # 3. Google Fonts (loli镜像) 的预连接
        { rel = "preconnect", href = "https://fonts.loli.net", crossorigin = true },
        # 4. Google Fonts (loli镜像) 的样式表
        { rel = "stylesheet", href = "https://fonts.loli.net/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" }
    ]

    # 【重要】字体名称不要加引号，不要加逗号，只写核心字体名
    headingFont = "Glyph Correction, Noto Serif TC"
    bodyFont = "Glyph Correction, I.MingCP"
    footerFont = "LXGW WenKai TC"
    metaFont = "LXGW WenKai TC"
    
    # 基础字号 (这些是纯数字+单位，不会触发 ZgotmplZ)
    baseFontSize = "16px" 
    sizeH1 = "2.5em"
    sizeH2 = "2em"
    sizeH3 = "1.5em"
    sizeBody = "1em"
    sizeSmall = "0.875em"
    sizeMeta = "0.8em"
    sizeFooter = "0.85em"

[menu]
    [[menu.main]]
        name = "首頁"
        url = "/"
        weight = 1
    [[menu.main]]
        name = "作品"
        url = "/gallery/"
        weight = 2
    [[menu.main]]
        name = "足跡"
        url = "/footprint/"
        weight = 3
    [[menu.main]]
        name = "關於"
        url = "/about/"
        weight = 7

[tonal_help]
other = "直方圖的四條曲線是紅、綠、藍通道與 Rec.709 明度，橫軸由暗到亮、縱軸為像素數量；虛線是明度中位數（P50），底色三分區以中灰上下各一檔為界（sRGB 85 與 162）。曝光灰階把亮度均分為 0–X 共 11 級，括號標出 P5–P95 所在的級數；百分比是陰影、中間調、高光的像素佔比（取整餘數併入最大段）；動態範圍取線性光下 P5–P95 的亮度跨度，換算成真檔。"


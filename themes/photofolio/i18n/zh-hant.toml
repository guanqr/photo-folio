other = "R|G|B|明度"

[lightbox_palette]
other = "色卡"

[palette_help]
other = "每個像素先按 RGB 各 16 級量化成 4096 個色桶，按像素數量從多到少取互相保持距離的種子色，再用 k-means 把所有色桶歸到最近的 6 個中心（按像素數加權、迭代 5 輪）；真實顏色不足 6 種時，把最大的一色向白或向黑混合拆出來補足。右側百分比是該顏色在整張照片中的像素佔比，不足 1% 顯示 <1%。"


{{ define "main" }}
{{ $author := .Site.Params.author }}

<section class="about-page">
    <div class="about-container">
        <div class="about-header">
            {{ with $author.avatar }}
                <img class="about-avatar" src="{{ . | relURL }}" alt="{{ $author.name }}">
            {{ end }}
            <div class="about-header-text">
                <h1 class="about-name">{{ $author.name }}</h1>
                {{ with $author.bio }}
                    <p class="about-bio">{{ . }}</p>
                {{ end }}
            </div>
        </div>

        {{ partial "components/about-stats.html" . }}

        <div class="about-copyright">
            <p>{{ i18n "copyright_notice" | safeHTML }}</p>
        </div>

    </div>
</section>
{{ end }}
